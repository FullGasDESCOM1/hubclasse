name: Aggiorna il sito

on:
  schedule:
    - cron: "7 * * * *"   # ogni ora, al minuto 7
  workflow_dispatch:      # pulsante "Run workflow" per aggiornare subito
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prende i dati e genera il sito
        run: python scripts/update.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Salva i dati una volta al giorno (tiene attivo l'aggiornamento automatico)
        if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *'
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            git config user.name "full-gas-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git diff --staged --quiet || (git commit -m "Dati aggiornati" && git push)
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
